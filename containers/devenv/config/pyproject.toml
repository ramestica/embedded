[project]
name = "embedded-devenv"
version = "0.1.0"
description = "Python tooling for the embedded devenv container (TM4C123GXL workflows)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy>=6.0",
    "ctypesgen>=1.1",
    "dash>=2.17",
    "fixedpoint>=1.0",
    "ipython>=8.20",
    "numpy>=1.26",
    "mako>=1.3",
    "matplotlib>=3.8",
    "panel>=1.4",
    "plotly>=5.20",
    "protobuf>=4.25",
    "pybind11>=2.12",
    "pydata-sphinx-theme>=0.15",
    "pyqtgraph>=0.13",
    "pyright>=1.1",
    "pyshark>=0.6",
    "pytest>=8.0",
    "pytest-bdd>=7.1",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "python-dateutil>=2.9",
    "python-lsp-server>=1.11",   # successor to the deprecated 'python-language-server'
    "specutils>=1.13",
    "scipy>=1.12",
    "sphinx>=7.2",
    "sphinx-autoapi>=3.0",
    "sphinxcontrib-plantuml>=0.30",
    "sphinx-rtd-theme>=2.0",
    "websockets>=12.0",
]

[tool.uv]
package = false
