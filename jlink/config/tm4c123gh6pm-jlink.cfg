#
# openocd configuration file to start server connected to cortex m4 on
# tiva or mini boards.
#
# This is a custom OpenOCD config that replaces the stock
# board/ek-tm4c123gxl.cfg. It was needed because you're using a J-Link
# instead of the on-board ICDI — the stock board config assumes the
# ICDI interface, so you needed your own that explicitly selects
# J-Link and SWD.
#
# Originally copied from:
#
# TI Tiva C Series ek-tm4c123gxl Launchpad Evaluation Kit
#
# http://www.ti.com/tool/ek-tm4c123gxl
#

adapter driver jlink

transport select swd

adapter speed 50

set CHIPNAME tm4c123gh6pm

source [find target/stellaris.cfg]

proc reset {} {
     echo "reset"

     init
     reset run
     shutdown                                        
}

#
# basically same as 'program' command
#
proc romboot {file_image} {
    echo "ROM boot"
    init
    reset init
    flash write_image erase $file_image
    verify_image $file_image 0x0 elf
    poll off
    reset run
    shutdown
}

#
# load to ram and resume at given address
#
proc ramboot {file_image resume_address} {
    global _TARGETNAME

    echo "RAM boot ($resume_address)"

    #
    # stellaris sets working are at low ram, readjust to avoid
    # clashing with actual binary
    #
    $_TARGETNAME configure -work-area-phys 0x20007fcc -work-area-size 0x52

    init
    reset halt

    #
    # orginally the following two lines where like commeneted
    # below. But there is actually no need to provide an address
    # offset nor file type. I imagine that the file type is detected
    # automatically, and from the elf memory location is extracted.
    #
    # load_image $file_image 0x0 elf
    # verify_image $file_image 0x0 elf
    #
    load_image $file_image
    verify_image $file_image

    resume $resume_address
    shutdown
}

